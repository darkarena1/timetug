name: Validate website on PR
on:
  pull_request:
    paths:
      - "site/**"
      - "scripts/dev/verify.sh"
      - "scripts/ci/tests/test-workflows.sh"
      - ".github/workflows/firebase-hosting-pull-request.yml"
permissions:
  contents: read
jobs:
  validate_site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pinned test prerequisites
        run: |
          python3 -m venv build/verify-venv
          build/verify-venv/bin/python -m pip install -r scripts/ci/requirements-test.txt
      - name: Validate website
        run: PATH="$PWD/build/verify-venv/bin:$PATH" scripts/dev/verify.sh release-tools
