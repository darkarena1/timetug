# Continuous integration for TimeTug. Runs on every push to master and on every pull request.
#
# Jobs:
#   release-tooling  Runs release scripts, workflow contracts, and website tests on Ubuntu.
#   core        Swift Testing suites for Packages/TimeTugCore, Packages/CalendarConnectors,
#               Packages/CalendarBridge, Packages/CalendarApple, Packages/EventKitSource and
#               Packages/AppleIntelligenceInference (macOS).
#   app         Generates the Xcode project with XcodeGen, then builds and runs the app's XCTest suite (macOS).
#   app-store-build  Builds the App Store target unsigned and checks it has no Sparkle (macOS).
#   dmg         Builds the release app and the unsigned drag-to-install DMG, verifies it and uploads it
#               as the `TimeTug-dmg` artifact (a fresh installer from every run).
#   architecture  Checks the AGENTS.md layering rules (scripts/ci/check-architecture.sh) on Linux.
#   core-linux  Runs the Core and CalendarConnectors tests on Linux to prove Core and the connector library
#               stay portable. Allowed to fail (see below).
#
# The macOS jobs need an Xcode with the macOS 26 SDK or newer (Liquid Glass APIs behind #available).
# If the `macos-26` runner label is not available to your account, change `runs-on` in all the macOS jobs
# (see docs/release.md, "Changing the runner label").
name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pinned test prerequisites
        run: |
          python3 -m venv build/verify-venv
          build/verify-venv/bin/python -m pip install -r scripts/ci/requirements-test.txt
      - name: Verify release tools, workflows, and website
        run: PATH="$PWD/build/verify-venv/bin:$PATH" scripts/dev/verify.sh release-tools

  core:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Select newest Xcode
        run: scripts/ci/select-xcode.sh
      - name: Test TimeTugCore
        run: swift test --package-path Packages/TimeTugCore
      - name: Test EventKitSource
        run: swift test --package-path Packages/EventKitSource
      - name: Test AppleIntelligenceInference
        run: swift test --package-path Packages/AppleIntelligenceInference
      - name: Test CalendarConnectors
        run: swift test --package-path Packages/CalendarConnectors
      - name: Test CalendarBridge
        run: swift test --package-path Packages/CalendarBridge
      - name: Test CalendarApple
        run: swift test --package-path Packages/CalendarApple

  app:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Select newest Xcode
        id: xcode
        run: |
          scripts/ci/select-xcode.sh
          echo "version=$(xcodebuild -version | tr '\n' ' ' | tr -c 'A-Za-z0-9.\n' '-')" >> "$GITHUB_OUTPUT"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate --spec Apps/macOS/project.yml
      - name: Cache SwiftPM and DerivedData
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            build/DerivedData/SourcePackages
            build/DerivedData/Build/Intermediates.noindex/SwiftExplicitPrecompiledModules
          key: spm-${{ runner.os }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('Apps/macOS/project.yml') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ steps.xcode.outputs.version }}-
      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild \
            -project Apps/macOS/TimeTug.xcodeproj \
            -scheme TimeTug \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/TestResults.xcresult \
            test
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: TestResults
          path: build/TestResults.xcresult
          if-no-files-found: ignore
  app-store-build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Select newest Xcode
        run: scripts/ci/select-xcode.sh
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate --spec Apps/macOS/project.yml
      - name: The checked-in App Store files match project.yml
        run: git diff --exit-code -- Apps/macOS/AppStore
      - name: Build the App Store target (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Apps/macOS/TimeTug.xcodeproj \
            -scheme TimeTug-AppStore \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData-store \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: The App Store build has no Sparkle
        run: |
          app=build/DerivedData-store/Build/Products/Debug/TimeTug-AppStore.app
          test ! -e "$app/Contents/Frameworks/Sparkle.framework"
          if /usr/libexec/PlistBuddy -c "Print :SUFeedURL" "$app/Contents/Info.plist" 2>/dev/null; then echo "SUFeedURL in the App Store build"; exit 1; fi
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = com.timetug.app.store

  dmg:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Select newest Xcode
        run: scripts/ci/select-xcode.sh
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build Release app
        run: scripts/ci/build-release.sh
      - name: Package unsigned DMG
        run: |
          VERSION="$(cat dist/version.txt)" DMG_SUFFIX=-unsigned scripts/release/make-dmg.sh
      - name: Verify DMG
        run: scripts/release/verify-dmg.sh dist/TimeTug-*-unsigned.dmg
      - name: Upload DMG
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: TimeTug-dmg
          path: |
            dist/TimeTug-*-unsigned.dmg
            dist/TimeTug-*-unsigned.dmg.sha256
          retention-days: 14
          if-no-files-found: error

  # The layering rules from AGENTS.md that the compiler does not enforce (imports, Package.swift
  # dependencies, no clock reads in Core), plus the tests of the check, of scripts/dev/affected-tests.sh and of the release preflight.
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check architecture rules
        run: scripts/ci/check-architecture.sh
      - name: Test the checks
        run: |
          scripts/ci/tests/test-check-architecture.sh
          scripts/dev/tests/test-affected-tests.sh
          scripts/release/tests/test-preflight.sh

  # Core and the connector library are meant to be portable (no Apple-only imports). This job checks that on Linux.
  # It is allowed to fail (continue-on-error) until Linux support is confirmed; once it is
  # green on master, remove `continue-on-error` so regressions block merges.
  core-linux:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Docker Hub limits anonymous pulls per IP address, and GitHub's runners share addresses. A read-only token for
      # public images lifts that. Pull requests from forks get no secrets, so the step is skipped and they pull anonymously.
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        run: |
          for attempt in 1 2 3; do
            echo "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin && exit 0
            sleep $((attempt * 15))
          done
          exit 1
      - name: Pull the Swift image
        run: |
          for attempt in 1 2 3; do
            docker pull swift:6.0 && exit 0
            sleep $((attempt * 15))
          done
          exit 1
      - name: Test TimeTugCore and CalendarConnectors
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/work" -w /work swift:6.0 \
            sh -c 'swift test --package-path Packages/TimeTugCore && swift test --package-path Packages/CalendarConnectors'
