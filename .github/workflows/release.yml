# Release workflow. Runs when the owner PUBLISHES a GitHub Release whose tag starts with `v` (the release
# and its notes are created by the owner; this workflow builds the tag's commit and UPLOADS the assets to
# it), or manually (workflow_dispatch with a `tag` input, a fallback that creates the release if it does
# not exist). Releases for other tags (for example beta-*) are ignored. Pushing a tag alone does nothing.
#
# One macOS job builds the app in Release (scripts/ci/build-release.sh), then:
#   - With ALL Apple signing secrets set (see docs/release.md): signs, notarizes and staples the app,
#     builds TimeTug-<version>.dmg, then signs, notarizes and staples the DMG too, and publishes a
#     normal GitHub Release (created by the owner, or by this workflow for a manual run). That release also carries the Sparkle update zip (built from the notarized
#     app, EdDSA-signed), and only after the release is published is the item added to the appcast (stable feed; a suffixed
#     tag such as v1.2.3-rc1 is a prerelease routed to the beta channel).
#   - Without them: builds TimeTug-<version>-unsigned.dmg and publishes a PRERELEASE.
# An unsigned release never enters the update feed (no zip, no appcast item).
# Both paths run scripts/release/verify-dmg.sh on the DMG before publishing.
# Release notes are generated by GitHub (`gh release create --generate-notes`).
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v0.1.0 (created from the selected commit if it does not exist)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    # Requires approval from the repository owner (Settings > Environments > release) and only
    # runs for master or v* tags.
    environment: release
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v')
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The tag's commit for a published release; the selected ref for a manual run.
          ref: ${{ github.event.release.tag_name || github.sha }}
          fetch-depth: 0
      - name: Build the tag's commit when the tag exists
        if: github.event_name == 'workflow_dispatch'
        run: |
          # A manual run for an existing tag must build that tag; otherwise it builds the selected ref
          # and the release step creates the tag at that commit.
          if git rev-parse -q --verify "refs/tags/$TAG^{commit}" >/dev/null; then
            git checkout --detach "refs/tags/$TAG"
          fi
      - name: Require the release commit to be on master
        run: |
          git fetch --quiet origin master
          COMMIT="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "$COMMIT" origin/master; then
            echo "::error::Releases can only be cut from commits on master; $COMMIT is not."
            exit 1
          fi
          echo "COMMIT=$COMMIT" >> "$GITHUB_ENV"
      - name: Check for signing secrets
        id: signing
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
          NOTARY_API_KEY_P8_BASE64: ${{ secrets.NOTARY_API_KEY_P8_BASE64 }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -n "$MACOS_CERTIFICATE_P12_BASE64" ] && [ -n "$MACOS_CERTIFICATE_PASSWORD" ] \
            && [ -n "$APPLE_TEAM_ID" ] && [ -n "$NOTARY_API_KEY_ID" ] \
            && [ -n "$NOTARY_API_ISSUER_ID" ] && [ -n "$NOTARY_API_KEY_P8_BASE64" ]; then
            if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
              echo "::error::SPARKLE_PRIVATE_KEY is not set; cannot publish a signed release"
              exit 1
            fi
            echo "has_signing=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_signing=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Signing secrets are not set; publishing an unsigned prerelease."
          fi
      - name: Select newest Xcode
        run: scripts/ci/select-xcode.sh
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Compute build number
        run: scripts/ci/compute-versions.sh stable "$TAG" >> "$GITHUB_ENV"
      - name: Build Release app
        run: scripts/ci/build-release.sh
      - name: Sign and notarize app
        if: steps.signing.outputs.has_signing == 'true'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
          NOTARY_API_KEY_P8_BASE64: ${{ secrets.NOTARY_API_KEY_P8_BASE64 }}
        run: scripts/release/sign-and-notarize.sh app
      - name: Package DMG
        if: steps.signing.outputs.has_signing == 'true'
        run: |
          VERSION="$(cat dist/version.txt)" scripts/release/make-dmg.sh
      - name: Sign and notarize DMG
        if: steps.signing.outputs.has_signing == 'true'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
          NOTARY_API_KEY_P8_BASE64: ${{ secrets.NOTARY_API_KEY_P8_BASE64 }}
        run: scripts/release/sign-and-notarize.sh dmg
      - name: Sparkle update zip and appcast (stable)
        if: steps.signing.outputs.has_signing == 'true'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          VERSION="$(cat dist/version.txt)"
          ZIP="dist/TimeTug-${VERSION}.zip"
          scripts/release/make-update-zip.sh dist/TimeTug.app "$ZIP"
          BIN="$(scripts/release/fetch-sparkle-tools.sh "$RUNNER_TEMP/sparkle")"
          KEY="$RUNNER_TEMP/sparkle.key"; umask 077
          trap 'rm -f "$KEY"' EXIT
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$KEY"
          SIG="$("$BIN/sign_update" --ed-key-file "$KEY" "$ZIP")"; rm -f "$KEY"
          SIG_VALUE="$(sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p' <<<"$SIG")"
          [ -n "$SIG_VALUE" ] || { echo "::error::could not read edSignature from sign_update output"; exit 1; }
          UPDATE_CHANNEL=""
          if [[ "$VERSION" == *-* ]]; then UPDATE_CHANNEL=beta; fi
          echo "UPDATE_ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "UPDATE_SIGNATURE=$SIG_VALUE" >> "$GITHUB_ENV"
          echo "UPDATE_LENGTH=$(stat -f%z "$ZIP")" >> "$GITHUB_ENV"
          echo "UPDATE_CHANNEL=$UPDATE_CHANNEL" >> "$GITHUB_ENV"
      - name: Verify DMG
        if: steps.signing.outputs.has_signing == 'true'
        run: |
          VERSION="$(cat dist/version.txt)"
          scripts/release/verify-dmg.sh "dist/TimeTug-${VERSION}.dmg"
      - name: Package unsigned DMG
        if: steps.signing.outputs.has_signing != 'true'
        run: |
          VERSION="$(cat dist/version.txt)" DMG_SUFFIX=-unsigned scripts/release/make-dmg.sh
      - name: Verify unsigned DMG
        if: steps.signing.outputs.has_signing != 'true'
        run: |
          VERSION="$(cat dist/version.txt)"
          scripts/release/verify-dmg.sh "dist/TimeTug-${VERSION}-unsigned.dmg"
      - name: Publish signed release
        if: steps.signing.outputs.has_signing == 'true'
        run: |
          VERSION="$(cat dist/version.txt)"
          FILES=("dist/TimeTug-${VERSION}.dmg" "dist/TimeTug-${VERSION}.dmg.sha256" "$UPDATE_ZIP")
          if [ "$GITHUB_EVENT_NAME" = release ] || gh release view "$TAG" >/dev/null 2>&1; then
            # The owner's release (title and notes) is left as it is.
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            gh release create "$TAG" "${FILES[@]}" \
              --title "TimeTug ${VERSION}" --target "$COMMIT" --generate-notes \
              --notes "SHA-256: $(cut -d' ' -f1 "dist/TimeTug-${VERSION}.dmg.sha256")"
          fi
          if [ "$UPDATE_CHANNEL" = beta ]; then gh release edit "$TAG" --prerelease; fi
      - name: Add item to the appcast
        if: steps.signing.outputs.has_signing == 'true'
        run: |
          VERSION="$(cat dist/version.txt)"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/$(basename "$UPDATE_ZIP")"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          CHANNEL_ARGS=()
          if [ "$UPDATE_CHANNEL" = beta ]; then CHANNEL_ARGS+=(--channel beta); fi
          scripts/release/publish-appcast.sh "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" -- \
            --title "TimeTug ${VERSION}" --version "$BUILD_NUMBER" --short "$VERSION" --url "$URL" \
            --length "$UPDATE_LENGTH" --signature "$UPDATE_SIGNATURE" --min-system 14.0 "${CHANNEL_ARGS[@]}" \
            --notes-url "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
      - name: Publish unsigned prerelease
        if: steps.signing.outputs.has_signing != 'true'
        run: |
          VERSION="$(cat dist/version.txt)"
          FILES=("dist/TimeTug-${VERSION}-unsigned.dmg" "dist/TimeTug-${VERSION}-unsigned.dmg.sha256")
          if [ "$GITHUB_EVENT_NAME" = release ] || gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            gh release create "$TAG" "${FILES[@]}" \
              --title "TimeTug ${VERSION} (unsigned)" --target "$COMMIT" --generate-notes \
              --notes "Unsigned build: macOS will warn on first open; right-click Open. If macOS says the app is damaged, run: xattr -dr com.apple.quarantine /Applications/TimeTug.app. SHA-256: $(cut -d' ' -f1 "dist/TimeTug-${VERSION}-unsigned.dmg.sha256")"
          fi
          gh release edit "$TAG" --prerelease
