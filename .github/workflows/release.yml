# Release workflow. Runs when a tag `v*` is pushed, or manually (workflow_dispatch with a `tag` input).
#
# One macOS job builds the app in Release (scripts/ci/build-release.sh), then:
#   - With ALL Apple signing secrets set (see docs/release.md): signs with Developer ID, notarizes,
#     staples, builds TimeTug-<version>.dmg and publishes a normal GitHub Release.
#   - Without them: builds TimeTug-<version>-unsigned.zip and publishes a PRERELEASE.
# Release notes are generated by GitHub (`gh release create --generate-notes`).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v0.1.0 (created from the selected commit if it does not exist)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: Select newest Xcode
        run: scripts/ci/select-xcode.sh
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build Release app
        run: scripts/ci/build-release.sh
      - name: Check for signing secrets
        id: signing
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
          NOTARY_API_KEY_P8_BASE64: ${{ secrets.NOTARY_API_KEY_P8_BASE64 }}
        run: |
          if [ -n "$MACOS_CERTIFICATE_P12_BASE64" ] && [ -n "$MACOS_CERTIFICATE_PASSWORD" ] \
            && [ -n "$APPLE_TEAM_ID" ] && [ -n "$NOTARY_API_KEY_ID" ] \
            && [ -n "$NOTARY_API_ISSUER_ID" ] && [ -n "$NOTARY_API_KEY_P8_BASE64" ]; then
            echo "has_signing=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_signing=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Signing secrets are not set; publishing an unsigned prerelease."
          fi
      - name: Sign and notarize
        if: steps.signing.outputs.has_signing == 'true'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
          NOTARY_API_KEY_P8_BASE64: ${{ secrets.NOTARY_API_KEY_P8_BASE64 }}
        run: scripts/release/sign-and-notarize.sh
      - name: Package DMG
        if: steps.signing.outputs.has_signing == 'true'
        run: |
          VERSION="$(cat dist/version.txt)" scripts/release/make-dmg.sh
      - name: Package unsigned zip
        if: steps.signing.outputs.has_signing != 'true'
        run: |
          VERSION="$(cat dist/version.txt)" scripts/release/make-zip.sh
      - name: Publish signed release
        if: steps.signing.outputs.has_signing == 'true'
        run: |
          VERSION="$(cat dist/version.txt)"
          gh release create "$TAG" \
            "dist/TimeTug-${VERSION}.dmg" "dist/TimeTug-${VERSION}.dmg.sha256" \
            --title "TimeTug ${VERSION}" --target "$GITHUB_SHA" --generate-notes \
            --notes "SHA-256: $(cut -d' ' -f1 "dist/TimeTug-${VERSION}.dmg.sha256")"
      - name: Publish unsigned prerelease
        if: steps.signing.outputs.has_signing != 'true'
        run: |
          VERSION="$(cat dist/version.txt)"
          gh release create "$TAG" \
            "dist/TimeTug-${VERSION}-unsigned.zip" "dist/TimeTug-${VERSION}-unsigned.zip.sha256" \
            --title "TimeTug ${VERSION} (unsigned)" --target "$GITHUB_SHA" --prerelease --generate-notes \
            --notes "Unsigned build: macOS will warn on first open; right-click Open. SHA-256: $(cut -d' ' -f1 "dist/TimeTug-${VERSION}-unsigned.zip.sha256")"
